services:
  db:
    image: postgres:16.13-bookworm
    environment:
      POSTGRES_DB: gear_drop
      POSTGRES_USER: gear_drop
      POSTGRES_PASSWORD: gear_drop_local
    volumes:
      - gear-drop-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gear_drop -d gear_drop"]
      interval: 2s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgresql://gear_drop:gear_drop_local@db:5432/gear_drop
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "scripts/check-api.ts"]
      interval: 3s
      timeout: 3s
      retries: 20

  web:
    build:
      context: .
      target: web
    environment:
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  gear-drop-db:
